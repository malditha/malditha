    <text x="72" y="84" fill="#f9a8d4" font-size="17" font-weight="700" letter-spacing="5">BUILDING IN PUBLIC · PH</text>
    <text x="68" y="185" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-2">KRIS LACANLALE</text>
    <text x="72" y="232" fill="#c4b5fd" font-size="23" font-weight="500" letter-spacing="1.5">FULL-STACK  ·  SYSTEMS  ·  AUTOMATION</text>
    <text x="72" y="294" fill="#94a3b8" font-size="17">turning complicated workflows into software people can rely on</text>
