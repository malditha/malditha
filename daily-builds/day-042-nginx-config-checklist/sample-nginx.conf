events {
    worker_connections 256;
}

http {
    server {
        listen 80;
        server_name app.example.test;

        location / {
            proxy_pass http://app;
        }
    }

    server {
        listen 443 ssl;
        server_name files.example.test;
        ssl_certificate /etc/nginx/certs/example.pem;
        ssl_certificate_key /etc/nginx/certs/example.key;
        root /srv/files;

        location /downloads/ {
            autoindex on;
        }
    }
}
